[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotus-render"
version = "0.1.0"
description = "Deterministic document rendering service for Lotus reporting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.133.0",
  "uvicorn==0.41.0",
  "pydantic==2.12.0",
  "pydantic-settings==2.14.2",
  "prometheus-client==0.25.0",
  "prometheus-fastapi-instrumentator==8.1.0",
  "starlette==1.6.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.15.0",
  "mypy==1.19.1",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.1.0",
  "httpx2==2.12.0",
  "coverage==7.13.5",
  "pip-audit==2.10.0",
  "msgpack==1.2.1",
  "PyYAML==6.0.3",
  "types-PyYAML==6.0.12.20260518",
  "radon==6.0.1",
  "vulture==2.16",
  "deptry==0.25.1",
  "pillow==12.3.0",
  "pypdf==6.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/app"]

[tool.setuptools.package-data]
"app.contracts" = ["examples/*.json"]

[tool.deptry]
# `app` is this repository's own package under `src`, not a third-party distribution. Without this
# deptry reports every internal import as DEP003 "transitive dependency" - 86 findings, all false -
# which is how a dependency gate ends up being switched off instead of configured.
known_first_party = ["app", "scripts"]
# The `dev` extra holds tooling, so it must not be judged against runtime imports.
optional_dependencies_dev_groups = ["dev"]
# `uvicorn` is the ASGI server, invoked from the command line and never imported. That is a
# structural property of how the service starts, not a temporary allowance, so it carries no expiry.
# `coverage` is a dev tool imported by a dev script (`scripts/coverage_gate.py`); deptry judges
# `scripts/` as production code. Also structural, also no expiry. Both entries match lotus-risk.
per_rule_ignores = { DEP002 = ["uvicorn"], DEP004 = ["coverage"] }
