[mypy]
python_version = 3.12
strict = True
mypy_path = src
files = src, tests

# Verbatim lifts of the platform branch-protection policy gate (render#66,
# promoted pattern). The canonical implementation lives with the reference
# adopter (lotus-gateway) and is deliberately kept BYTE-IDENTICAL here: the
# pattern's value is that a canonical fix reaches every adopter by re-lifting,
# and its parity check compares content hashes. This repository proved the cost
# of the alternative - an earlier copy annotated locally for these same codes
# drifted 102 lines behind the hardened canonical, losing the nested-field
# validation that stops a gutted policy passing the offline gate. The exemption
# names two files and nothing else; locally authored code, this repository's own
# policy table included, stays strict.
[mypy-scripts.check_branch_protection_policy]
disable_error_code = no-any-return

# tests/ is not a package here, so mypy names this module by its stem.
[mypy-test_branch_protection_policy]
disable_error_code = no-untyped-def, type-arg
