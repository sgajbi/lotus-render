name: Main Releasability Gate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional merged pull-request SHA that this run must validate."
        required: false
        type: string
      triggering_pr:
        description: "Optional pull request number that dispatched this mainline validation."
        required: false
        type: string

# Key on the immutable merge SHA supplied by the dispatcher. Operator-dispatched runs fall back to
# github.sha. A ref-keyed group could let a newer revision silently cancel the only releasability
# evidence for an earlier revision (issue #79).
concurrency:
  group: ${{ github.workflow }}-${{ inputs.expected_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"

jobs:
  exact-revision-assertion:
    name: Main Releasability / Exact Revision Assertion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Assert expected merged PR SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRIGGERING_PR: ${{ inputs.triggering_pr }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ -z "$EXPECTED_SHA" ]; then
            echo "No expected_sha input supplied; treating this as an operator-dispatched main releasability run."
            exit 0
          fi
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Main releasability checkout SHA $actual_sha does not match expected merged PR SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown}."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            echo "::error::Expected SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown} is not reachable from origin/main."
            exit 1
          fi

  workflow-lint:
    name: Main Releasability / Workflow Lint
    needs: [exact-revision-assertion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  lint-typecheck-security:
    name: Main Releasability / Lint Typecheck Security
    needs: [exact-revision-assertion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Verify Dependencies
        run: .venv/bin/python -m pip check
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Code Health Gates
        run: make code-health-gates
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: Template Registry Gate
        run: make template-registry-gate
      - name: Security Audit
        run: make security-audit

  test-suites:
    name: Main Releasability / Tests (${{ matrix.suite }})
    needs: [lint-typecheck-security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            path: tests/unit
          - suite: integration
            path: tests/integration
          - suite: e2e
            path: tests/e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Verify Render Runtime
        run: make render-runtime-gate
      - name: Run tests with coverage data
        env:
          COVERAGE_FILE: .coverage.${{ matrix.suite }}
        run: .venv/bin/python -m pytest ${{ matrix.path }} --cov=src --cov-report=
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.suite }}
          path: .coverage.${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: error

  coverage-gate:
    name: Main Releasability / Coverage Gate (Combined)
    needs: [test-suites]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data
      - name: Enforce 99% coverage
        run: |
          .venv/bin/python -m coverage combine coverage-data
          .venv/bin/python -m coverage report --fail-under=99
      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-coverage-data
          path: |
            .coverage
            coverage-data
          include-hidden-files: true
          if-no-files-found: error

  docker-build:
    name: Main Releasability / Validate Docker Build
    needs: [coverage-gate]
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Build Docker image
        run: make docker-build
      - name: Generate dependency SBOM
        run: |
          python -m pip install cyclonedx-bom
          python -m cyclonedx_py environment --output-format JSON --output-file sbom.cdx.json
      - name: Generate release metadata manifest
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          Path("release-evidence.json").write_text(
              json.dumps(
                  {
                      "repository": os.environ["GITHUB_REPOSITORY"],
                      "commit_sha": os.environ["GITHUB_SHA"],
                      "ref": os.environ["GITHUB_REF"],
                      "workflow": os.environ["GITHUB_WORKFLOW"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "dockerfile_path": "Dockerfile",
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-release-evidence
          path: |
            sbom.cdx.json
            release-evidence.json
          if-no-files-found: error
