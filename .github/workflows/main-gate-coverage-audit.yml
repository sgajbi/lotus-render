name: Main Gate Coverage Audit

# Asks GitHub which commits on main the releasability gate actually evaluated, and fails
# when one has no run. The dispatcher now fires a run per revision a pull request adds
# (#174), and this is what proves it kept doing so: the failure mode being guarded is a
# commit that is never gated, which is not itself a failure anywhere and so reports
# nothing.
#
# It cannot live in `make check`, which must run offline: the audit asks the API which
# runs exist. It cannot live in the releasability gate either -- the runs for a
# multi-commit pull request are dispatched together, so an audit inside one of them
# would see the others as missing and fail on a race. A schedule sees the settled state.
#
# The window is a span of time rather than a count of commits. Forty commits at this
# repository's rate is about a day, so a busy day pushed the earliest out of sight before
# the next run looked -- and eleven commits from 2026-08-29, by then 71 to 92 behind head,
# had aged past it ungated and unreported by anything.
#
# A schedule is also not a guarantee that anything runs, so the merge dispatcher asks this
# workflow when it last succeeded. See `--assert-recent-audit`.

on:
  schedule:
    # Daily, after the working day in Asia/Singapore, so a gap opened by a merge is
    # reported the same day it appears rather than the next morning.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "How far back to audit, as a git date expression."
        required: false
        default: "3 days ago"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    name: Main Gate Coverage Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit which commits on main were gated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/audit_main_gate_coverage.py \
            --since "${{ inputs.since || '3 days ago' }}" \
            --fail-on-gap
      - name: Enforce Branch Protection Policy
        if: ${{ !cancelled() }}
        env:
          # github.token cannot carry administration:read, which the branch
          # protection endpoint requires; the automerge PAT can. A missing or
          # unauthorized token fails the gate rather than passing it silently.
          GH_TOKEN: ${{ secrets.LOTUS_AUTOMERGE_TOKEN }}
        run: python scripts/check_branch_protection_policy.py
